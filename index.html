    <style>
:root { --glow: #7df9ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; }
body { display: flex; align-items: center; justify-content: center; }
/* The play field keeps the original 4:3 aspect ratio and is letterboxed in any window. */
#stage { position: relative; width: min(100vw, 133.333vh); height: min(75vw, 100vh); overflow: hidden; background: #000; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

#hud .mid canvas { margin: 0 auto; }

#banner { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin; text-align: center; background: radial-gradient(ellipse at center, rgba(2,2,10,.25), rgba(2,2,10,.72)); }
#banner.visible { display: flex; }

#banner .banner-prompt { animation: blink 1.1s steps(2, start) infinite; }

  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module">
// src/game/constants.ts
var SCREEN_W = 256;
var SCREEN_H = 192;
var STEP = 1 / 120;
var PLATFORMS = [
  { attr: 4, x: 128, y: 96, w: 27 },
  // middle
  { attr: 6, x: 120, y: 184, w: 136 },
  // bottom (ground)
  { attr: 4, x: 48, y: 72, w: 35 },
  // left
  { attr: 4, x: 208, y: 48, w: 35 }
  // right
];
function platformRect(p) {
  const left = p.x - (p.w & 252) + 16;
  const tiles = (p.w >> 2) - 2;
  return { x: left, y: p.y, w: tiles * 8, h: 8, tiles };
}
var JETMAN_START = { x: 128, y: 184 };
var ROCKET_X = 168;
var ROCKET_Y = 184;
var TOP_MODULE_START = { x: 48, y: 72 };
var MID_MODULE_START = { x: 128, y: 96 };
var DROP_COLUMNS = [
  8,
  32,
  40,
  48,
  56,
  64,
  88,
  96,
  120,
  128,
  136,
  192,
  224,
  8,
  88,
  96
];
var SPAWN_GRACE = 1;
var START_LIVES = 4;
var LEVEL_ALIENS = [
  "meteor",
  "squidgy",
  "sphere",
  "jetFighter",
  "ufo",
  "crossShip",
  "spaceCraft",
  "frog"
];
var ALIEN_POINTS = {
  meteor: 25,
  squidgy: 80,
  sphere: 40,
  jetFighter: 55,
  ufo: 50,
  crossShip: 60,
  spaceCraft: 25,
  frog: 50
};
var SPECTRUM_BRIGHT = [
  0,
  255,
  16711680,
  16711935,
  65280,
  65535,
  16776960,
  16777215
];

// src/game/geometry.ts
var wrapX = (x) => (x % SCREEN_W + SCREEN_W) % SCREEN_W;
function wrapDelta(a, b) {
  return ((b - a + SCREEN_W / 2) % SCREEN_W + SCREEN_W) % SCREEN_W - SCREEN_W / 2;
}
function overlaps(a, b) {
  return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
}
var PLATFORM_BOXES = PLATFORMS.flatMap((p) => {
  const r = platformRect(p);
  return [-SCREEN_W, 0, SCREEN_W].map((off) => ({
    l: r.x + off,
    r: r.x + r.w + off,
    t: r.y,
    b: r.y + r.h,
    top: r.y
  }));
});
function firstPlatformHit(box) {
  for (const p of PLATFORM_BOXES) if (overlaps(box, p)) return p;
  return null;
}
function penetration(box, p) {
  const fromTop = box.b - p.t;
  const fromBottom = p.b - box.t;
  const fromLeft = box.r - p.l;
  const fromRight = p.r - box.l;
  const min = Math.min(fromTop, fromBottom, fromLeft, fromRight);
  if (min === fromTop) return { contact: "top", push: -fromTop };
  if (min === fromBottom) return { contact: "bottom", push: fromBottom };
  if (min === fromLeft) return { contact: "left", push: -fromLeft };
  return { contact: "right", push: fromRight };
}

// src/game/Game.ts
var ALIEN_SLOT_COLOURS = [4, 5, 2, 3, 4, 5];
var ALIEN_H = {
  meteor: 11,
  squidgy: 14,
  sphere: 16,
  jetFighter: 7,
  ufo: 8,
  crossShip: 15,
  spaceCraft: 14,
  frog: 14
};
var TUNING = {
  jetman: {
    accelX: 620,
    dragX: 330,
    maxX: 105,
    gravity: 520,
    thrust: 1150,
    maxUp: 118,
    maxDown: 112,
    walk: 62,
    top: 42,
    // highest feet position (keeps Jetman under the score line)
    boxL: 3,
    boxR: 13,
    boxH: 23
  },
  alienSpeed: 100,
  chaseSpeed: 95,
  chaseAccel: 170,
  laserSpeed: 420,
  laserMinInterval: 0.08,
  itemFall: 100,
  rocketSpeed: 50,
  deathDelay: 1.1
};
var rnd = (a, b) => a + Math.random() * (b - a);
var Game = class {
  phase = "title";
  /** Seconds of play. */
  time = 0;
  level = 0;
  lives = 0;
  score = 0;
  hiScore = 0;
  /** Seconds left of the post-respawn grace period (no new aliens). */
  beginDelay = 0;
  gameOverTimer = 0;
  deathTimer = 0;
  jetman = this.newJetman();
  rocket = this.newRocket();
  /** Slot 1: top rocket module at level start, fuel pods afterwards. */
  pod = null;
  /** Slot 2: middle rocket module at level start, collectibles afterwards. */
  item = null;
  aliens = [null, null, null, null, null, null];
  lasers = [];
  booms = [];
  /** Debug/test switch: stop new aliens from spawning. */
  aliensEnabled = true;
  onSfx = () => {
  };
  fireCooldown = 0;
  spawnCooldown = 0;
  collectibleClock = 0;
  sfxType = 0;
  // 0 none, 12 enemy death, 13 Jetman/sphere death
  sfxDur = 0;
  sfxClock = 0;
  thrusterClock = 0;
  /** 50Hz style counters for the renderer's blinking/flashing. */
  get tick() {
    return Math.floor(this.time * 50);
  }
  get timer() {
    return this.tick;
  }
  // --------------------------------------------------------------------- setup
  newJetman() {
    return {
      mode: "none",
      active: false,
      x: JETMAN_START.x,
      y: JETMAN_START.y,
      px: JETMAN_START.x,
      py: JETMAN_START.y,
      vx: 0,
      vy: 0,
      faceLeft: false,
      thrusting: false
    };
  }
  newRocket() {
    return {
      x: ROCKET_X,
      y: ROCKET_Y,
      px: ROCKET_X,
      py: ROCKET_Y,
      state: "pad",
      modules: 1,
      fuel: 0,
      model: 0
    };
  }
  newItem(kind, x, y, sprite = 0) {
    return { kind, x, y, px: x, py: y, sprite, locked: kind === "top", carried: false, delivering: false };
  }
  startGame() {
    this.phase = "playing";
    this.level = 0;
    this.lives = START_LIVES;
    this.score = 0;
    this.time = 0;
    this.aliens = [null, null, null, null, null, null];
    this.lasers = [];
    this.booms = [];
    this.collectibleClock = 0;
    this.deathTimer = 0;
    this.resetRocketLevel();
    this.playerInit();
  }
  /** New rocket plus the two modules lying on the platforms. */
  resetRocketLevel() {
    this.rocket = this.newRocket();
    this.rocket.model = this.level >> 2 & 3;
    this.pod = this.newItem("top", TOP_MODULE_START.x, TOP_MODULE_START.y);
    this.item = this.newItem("mid", MID_MODULE_START.x, MID_MODULE_START.y);
  }
  playerInit() {
    this.jetman = this.newJetman();
    this.jetman.mode = "fly";
    this.jetman.active = true;
    this.beginDelay = SPAWN_GRACE;
    this.lives--;
    this.sfx({ t: "square", d: 48, c: 64, silentStart: false });
  }
  // ------------------------------------------------------------------- helpers
  sfx(e) {
    this.onSfx(e);
  }
  addScore(points) {
    this.score += points;
    if (this.score > this.hiScore) this.hiScore = this.score;
  }
  get jetmanLive() {
    return this.jetman.mode !== "none" && this.jetman.active;
  }
  get carrying() {
    for (const it of [this.pod, this.item]) if (it && it.carried && !it.delivering) return it;
    return null;
  }
  jetmanBox() {
    const j = this.jetman;
    const t = TUNING.jetman;
    return { l: j.x + t.boxL, r: j.x + t.boxR, t: j.y - t.boxH, b: j.y };
  }
  alienBox(a) {
    return { l: a.x + 1, r: a.x + 15, t: a.y - ALIEN_H[a.kind], b: a.y };
  }
  itemBox(it) {
    const h = it.kind === "top" || it.kind === "mid" ? 16 : it.kind === "pod" ? 11 : 12;
    return { l: it.x + 2, r: it.x + 14, t: it.y - h, b: it.y };
  }
  // ---------------------------------------------------------------------- step
  /** Advance the simulation by one fixed step (STEP seconds). */
  update(input) {
    if (this.phase === "gameover") {
      this.gameOverTimer -= STEP;
      if (this.gameOverTimer <= 0) this.phase = "title";
      return;
    }
    if (this.phase !== "playing") return;
    this.time += STEP;
    this.snapshot();
    this.updateJetman(input);
    this.updateLasers();
    this.updateRocket();
    this.updateItem(this.pod, "pod");
    this.updateItem(this.item, "item");
    this.updateAliens();
    this.updateSfxObject();
    this.updateBooms();
    this.updateDeath();
    this.spawn();
  }
  snapshot() {
    const bodies = [this.jetman, this.rocket, this.pod, this.item, ...this.aliens];
    for (const b of bodies) {
      if (b) {
        b.px = b.x;
        b.py = b.y;
      }
    }
    for (const l of this.lasers) l.px = l.head;
  }
  // -------------------------------------------------------------------- Jetman
  updateJetman(input) {
    const j = this.jetman;
    if (j.mode === "none") return;
    if (this.beginDelay > 0) this.beginDelay -= STEP;
    this.fireCooldown -= STEP;
    const T = TUNING.jetman;
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (dir) j.faceLeft = dir < 0;
    if (j.mode === "fly") {
      j.thrusting = input.thrust;
      if (dir) j.vx += dir * T.accelX * STEP;
      else if (Math.abs(j.vx) <= T.dragX * STEP) j.vx = 0;
      else j.vx -= Math.sign(j.vx) * T.dragX * STEP;
      j.vx = Math.max(-T.maxX, Math.min(T.maxX, j.vx));
      j.vy += (input.thrust ? -T.thrust : T.gravity) * STEP;
      j.vy = Math.max(-T.maxUp, Math.min(T.maxDown, j.vy));
      j.x = wrapX(j.x + j.vx * STEP);
      this.resolveJetmanX();
      const prevFeet = j.y;
      j.y += j.vy * STEP;
      if (j.y < T.top) {
        j.y = T.top;
        if (j.vy < 0) j.vy = -j.vy * 0.3;
      }
      this.resolveJetmanY(prevFeet);
    } else {
      j.thrusting = false;
      j.vx = dir * T.walk;
      j.vy = 0;
      j.x = wrapX(j.x + j.vx * STEP);
      this.resolveJetmanX();
      if (input.thrust) {
        j.mode = "fly";
        j.vy = -45;
        j.y -= 0.5;
      } else if (!this.hasSupport()) {
        j.mode = "fly";
        j.vy = 0;
      }
    }
    if (this.jetman.mode !== "none" && input.fire && this.fireCooldown <= 0) this.fireLaser();
  }
  hasSupport() {
    const b = this.jetmanBox();
    for (const p of PLATFORM_BOXES) {
      if (Math.abs(b.b - p.top) < 0.75 && b.r > p.l && b.l < p.r) return true;
    }
    return false;
  }
  /** Stop Jetman walking/flying sideways into a platform. */
  resolveJetmanX() {
    const j = this.jetman;
    const T = TUNING.jetman;
    const b = this.jetmanBox();
    const p = firstPlatformHit({ ...b, b: b.b - 0.05 });
    if (!p) return;
    const pen = penetration(b, p);
    if (pen.contact === "left" || pen.contact === "right") {
      j.x = wrapX(j.x + pen.push);
      j.vx = -j.vx * 0.35;
      void T;
    }
  }
  resolveJetmanY(prevFeet) {
    const j = this.jetman;
    const T = TUNING.jetman;
    const b = this.jetmanBox();
    const p = firstPlatformHit(b);
    if (!p) return;
    if (j.vy >= 0 && prevFeet <= p.top + 0.5) {
      j.y = p.top;
      j.vy = 0;
      j.vx = 0;
      j.mode = "walk";
    } else if (j.vy < 0) {
      j.y = p.b + T.boxH + 0.01;
      j.vy = Math.abs(j.vy) * 0.25 + 10;
    } else {
      const pen = penetration(b, p);
      if (pen.contact === "left" || pen.contact === "right") j.x = wrapX(j.x + pen.push);
      else j.y += pen.push;
    }
  }
  // -------------------------------------------------------------------- lasers
  fireLaser() {
    if (this.lasers.length >= 4) return;
    const j = this.jetman;
    const dir = j.faceLeft ? -1 : 1;
    const start = dir === 1 ? j.x + 18 : j.x - 2;
    const colours = [7, 3, 3, 5];
    this.fireCooldown = TUNING.laserMinInterval;
    this.lasers.push({
      y: j.y - 13,
      dir,
      head: start,
      tail: start,
      range: (16 + Math.floor(Math.random() * 8)) * 8,
      px: start,
      colour: colours[Math.floor(Math.random() * 4)]
    });
    this.sfx({ t: "laser" });
  }
  updateLasers() {
    for (const l of this.lasers) {
      if (l.range > 0) {
        const move = Math.min(l.range, TUNING.laserSpeed * STEP);
        const next = l.head + move * l.dir;
        const hit = firstPlatformHit({ l: wrapX(next) - 1, r: wrapX(next) + 1, t: l.y - 1, b: l.y + 1 });
        if (hit) l.range = 0;
        else {
          l.head = next;
          l.range -= move;
        }
      }
      const gap = (l.head - l.tail) * l.dir;
      if (l.range <= 0 || gap >= 32) l.tail += Math.min(gap, TUNING.laserSpeed * STEP) * l.dir;
    }
    this.lasers = this.lasers.filter((l) => (l.head - l.tail) * l.dir > 0.01 || l.range > 0);
  }
  laserHits(a) {
    const box = this.alienBox(a);
    for (const l of this.lasers) {
      if (l.y < box.t - 3 || l.y > box.b + 3) continue;
      const lo = Math.min(l.head, l.tail);
      const hi = Math.max(l.head, l.tail);
      for (const off of [-SCREEN_W, 0, SCREEN_W]) {
        if (hi + off >= box.l && lo + off <= box.r) {
          l.range = 0;
          return true;
        }
      }
    }
    return false;
  }
  // --------------------------------------------------------------------- death
  killJetman() {
    const j = this.jetman;
    if (j.mode === "none") return;
    this.booms.push({ x: j.x, y: j.y, age: 0, big: true, colour: 7 });
    j.mode = "none";
    j.active = false;
    this.deathTimer = TUNING.deathDelay;
    for (const it of [this.pod, this.item]) {
      if (it && it.carried && !it.delivering) it.carried = false;
    }
  }
  updateDeath() {
    if (this.deathTimer > 0) {
      this.deathTimer -= STEP;
      if (this.deathTimer <= 0) this.playerTurnEnds();
    }
  }
  playerTurnEnds() {
    this.aliens = [null, null, null, null, null, null];
    this.lasers = [];
    if (this.lives <= 0) {
      this.phase = "gameover";
      this.gameOverTimer = 4;
      return;
    }
    this.playerInit();
  }
  // ----------------------------------------------------------------------- sfx
  setExplosion(type) {
    this.sfxType = type;
    this.sfxDur = 4;
    this.sfxClock = 0;
  }
  /** The original plays the explosion as three short descending sweeps, one per tick. */
  updateSfxObject() {
    if (!this.sfxType) return;
    this.sfxClock -= STEP;
    if (this.sfxClock > 0) return;
    this.sfxClock += 0.02;
    if (--this.sfxDur === 0) {
      this.sfxType = 0;
      return;
    }
    const c = this.sfxType === 13 ? 16 : this.sfxDur + 24;
    this.sfx({ t: "explode", c });
  }
  thrusterSfx(y) {
    this.thrusterClock -= STEP;
    if (this.thrusterClock > 0) return;
    this.thrusterClock += 0.02;
    const yy = Math.floor(y);
    const d = (yy >> 4 | yy << 4) & 127 | 64;
    this.sfx({ t: "square", d, c: 16, silentStart: true });
  }
  // -------------------------------------------------------------------- rocket
  updateRocket() {
    const r = this.rocket;
    if (r.state === "pad") {
      if (r.fuel >= 6 && this.jetmanLive) {
        const box = { l: r.x, r: r.x + 16, t: r.y - 16 * r.modules, b: r.y };
        const jb = this.jetmanBox();
        if (overlaps({ l: jb.l - 2, r: jb.r + 2, t: jb.t - 2, b: jb.b + 2 }, box)) {
          r.state = "up";
          this.jetman.mode = "none";
          this.jetman.active = false;
          this.lives++;
        }
      }
    } else if (r.state === "up") {
      r.y -= TUNING.rocketSpeed * STEP;
      this.thrusterSfx(r.y);
      if (r.y < 40) this.nextLevel();
    } else {
      r.y += TUNING.rocketSpeed * STEP;
      this.thrusterSfx(r.y);
      if (r.y >= ROCKET_Y) {
        r.y = ROCKET_Y;
        r.state = "pad";
        this.playerInit();
      }
    }
  }
  nextLevel() {
    this.level++;
    this.aliens = [null, null, null, null, null, null];
    this.lasers = [];
    this.pod = null;
    this.item = null;
    this.rocket.fuel = 0;
    this.rocket.state = "down";
    this.rocket.py = this.rocket.y;
    if ((this.level & 3) === 0) {
      this.resetRocketLevel();
      this.lives++;
      this.playerInit();
    }
  }
  // --------------------------------------------------------------------- items
  /** Fall straight down and stop on the first platform surface. */
  fall(it, speed) {
    const box = this.itemBox(it);
    const prev = it.y;
    const next = it.y + speed * STEP;
    for (const p of PLATFORM_BOXES) {
      if (box.r > p.l && box.l < p.r && prev <= p.top + 0.01 && next >= p.top) {
        it.y = p.top;
        return;
      }
    }
    it.y = next;
  }
  updateItem(it, slot) {
    if (!it) return;
    const j = this.jetman;
    const r = this.rocket;
    const remove = () => {
      if (slot === "pod") this.pod = null;
      else this.item = null;
    };
    if (it.kind === "collectible") {
      this.fall(it, TUNING.itemFall);
      if (this.jetmanLive && overlaps(this.jetmanBox(), this.itemBox(it))) {
        this.addScore(250);
        this.sfx({ t: "square", d: 48, c: 64, silentStart: false });
        remove();
      }
      return;
    }
    if (it.delivering) {
      if (it.kind === "pod") {
        if (it.y >= r.y - 7) {
          r.fuel++;
          this.sfx({ t: "square", d: 32, c: 80, silentStart: true });
          remove();
        } else it.y += TUNING.itemFall * STEP;
      } else {
        const target = r.y - 16 * r.modules;
        if (it.y >= target) {
          r.modules++;
          this.sfx({ t: "square", d: 32, c: 80, silentStart: true });
          if (this.pod && this.pod.kind === "top") this.pod.locked = false;
          remove();
        } else it.y += TUNING.itemFall * STEP;
      }
      return;
    }
    if (it.carried) {
      it.x = j.x;
      it.y = j.y;
      if (Math.abs(wrapDelta(r.x, it.x)) < 8) {
        it.delivering = true;
        it.x = r.x;
      }
      return;
    }
    if (it.locked) return;
    if (this.jetmanLive && !this.carrying) {
      const b = this.itemBox(it);
      const grow = { l: b.l - 2, r: b.r + 2, t: b.t - 2, b: b.b + 2 };
      if (overlaps(this.jetmanBox(), grow)) {
        it.carried = true;
        this.addScore(100);
        this.sfx({ t: "square", d: 80, c: 40, silentStart: true });
        return;
      }
    }
    this.fall(it, TUNING.itemFall);
  }
  // -------------------------------------------------------------------- aliens
  killAlien(a, points, sfx) {
    if (points) this.addScore(points);
    a.exploding = true;
    a.expTimer = 0.12;
    this.booms.push({ x: a.x, y: a.y, age: 0, big: false, colour: a.colour });

};

var RIGHT = ["ArrowRight", "KeyD", "KeyX", "KeyL", "Numpad6"];
var THRUST = ["ArrowUp", "KeyW", "KeyQ", "KeyI", "Numpad8"];

      "keydown",

          this.pressed.add(e.code);
          this.latched.add(e.code);

        this.down.add(e.code);

  sample() {

      left: this.any(LEFT, true),
      right: this.any(RIGHT, true),
      thrust: this.any(THRUST, true),
      fire: this.any(FIRE, true)

  }

  consume(...codes) {
    let hit = false;
    for (const c of codes) if (this.pressed.delete(c)) hit = true;

  }
  endFrame() {
    this.pressed.clear();
  }
